[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnl-attribution-engine"
version = "0.1.0"
description = "Auditable portfolio P&L reconciliation and attribution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pnl-attribute = "pnl_attribution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
